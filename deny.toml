[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# ttf-parser (winit/metal paths) and paste are unmaintained upstream; the
# advisories are tracked here and ignored until the replacement lands, matching
# the cargo-audit step in CI. Inherited from the pinned bitty production
# revision (see crates/bitty-perf/Cargo.toml); this repository cannot fix
# upstream, only track.
# Time bound: re-check both upstream replacements no later than 2027-03-31 and
# drop each ignore when its replacement lands; any extension needs a dated,
# reviewed revision of this file, never a silent edit.
ignore = ["RUSTSEC-2026-0192", "RUSTSEC-2024-0436"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
# Permissive core set (MIT, Apache-2.0, BSD, ISC, Zlib) plus permissive
# licenses in use by unavoidable transitive dependencies inherited from the
# pinned bitty production revision:
# Unicode-3.0 -> unicode-ident, CC0-1.0 -> hexf-parse (naga),
# BSL-1.0 -> clipboard-win / error-code (arboard on Windows).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.8
# The single MPL-2.0 node is dwrote (crossfont's Windows DirectWrite binding,
# inherited from the pinned bitty revision), which has no permissive
# alternative today; scope it per crate instead of a global allowance.
# Time bound: re-check no later than 2027-03-31; any further copyleft node
# needs a dated, reviewed revision of this file, never a silent edit.
exceptions = [{ allow = ["MPL-2.0"], crate = "dwrote" }]

[licenses.private]
ignore = true
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Exact-rev git pins only (W-105 relocation, bitty CTX-0931). bitty is the
# pinned immutable production revision under test
# (bitty@9bc73207ab559d4d5de4ef283a4056dc8857de01, see
# crates/bitty-perf/Cargo.toml); bitty-ipc and bitty-network enter
# transitively through that pin (bitty-runtime/bitty-rich inbound socket
# mechanism and the native-component wire codec), phodopus is the Lua
# engine swap target, and kyren/gc-arena is phodopus's own rev-pinned
# transitive arena backing — kept visible here rather than hidden behind a
# wildcard so any new git source still fails loudly.
# Time bound: re-audit all pins (rev freshness, source trust) no later than
# 2027-03-31; any new git source needs a dated, reviewed revision of this
# file, never a silent allowlist edit.
allow-git = [
    "https://github.com/bitty-terminal/bitty",
    "https://github.com/bitty-terminal/bitty-ipc",
    "https://github.com/bitty-terminal/bitty-network",
    "https://github.com/bitty-terminal/phodopus",
    "https://github.com/kyren/gc-arena",
]
